        - text: Haflong Government College is in its 66th year of existence. This college was born through the vision of the illustrious sons of the soil like Late N.L. Daolagupu, backed by the unstinted support of the intelligentsia of that time like Sonaram Thaosen, J.B Hagjer, Surath Chandra Daulagupu, Hironmoy Das Barman, G.C. Langthasa, P.C. Langthasa, D. Hojai, P.K. Gorlosa, V. Hmar, Nishikanta Daulagupu, Yusuf Khan and B. Chakraborty. The dream and vision of the pioneers became a reality with the establishment of this college on the 4th of September, 1961 and thus a new chapter was added to the annals of this hilly district. Since its inception this premier institution took up cudgels to articulate the aspirations of the ethnic societies of the district. This college was started as a private night college with 17 students on its roll in the Pre-university Arts classes at the Cultural Institute Hall. Later on it was shifted to its present site in 1964. In ...
