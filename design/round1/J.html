<!doctype html>
<html lang="en">
<head>

<title>Ahom</title>
<style>
@font-face{font-family:"Plex Sans Condensed";src:url(fonts/IBMPlexSansCondensed-Regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Plex Sans Condensed";src:url(fonts/IBMPlexSansCondensed-Bold.woff) format("woff");font-weight:700}
@font-face{font-family:"Lohit Assamese";src:url(fonts/Lohit-Assamese.ttf) format("truetype")}
body{margin:0;background:#3B2E22;color:#EFE3CB;min-height:100vh}
main{box-sizing:border-box;min-height:100vh;padding:4vh 4vw;display:flex;flex-direction:column;justify-content:space-between}
.top{font:400 clamp(.9rem,1.3vw,1.1rem)/1.3 "Plex Sans Condensed",sans-serif;color:#B9A27F;margin:0;max-width:44ch}

.row{display:flex;justify-content:space-between;align-items:flex-end;gap:3vw;flex-wrap:wrap}

.dt{font:700 clamp(1.4rem,2.6vw,2.4rem)/1 "Plex Sans Condensed",sans-serif;color:#C4452B;margin:0;letter-spacing:-.01em}
</style>
</head>
<body>
<main>
<p class="top">In 1228 a Tai prince named Sukaphaa crossed the Patkai hills into Assam. His line ruled the valley for six centuries, held off the Mughal Empire and fell only to Burmese armies and a British treaty.</p>
<h1 class="big">Six hundred years on the <span class="red">Brahmaputra</span></h1>
<div class="row">
<p class="as" lang="as">আহোম · স্বৰ্গদেউ · বুৰঞ্জী</p>
<p class="dt">1228–1838 <span style="color:#B9A27F;font-weight:400">Forty-one reigns</span></p>
</div>
</main>
