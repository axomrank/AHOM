<style>

body{margin:0;background:#2A2319;color:#E5D6B4;min-height:100vh}

<body>
<main>
<p class="s1">1228–1838</p>
<p class="s2">In 1228 a Tai prince named Sukaphaa crossed the Patkai hills into Assam. His line ruled the valley for six centuries, held off the Mughal Empire and fell only to Burmese armies and a British treaty.</p>
<h1 class="s3" style="margin-top:0">Six hundred years on the Brahmaputra</h1>
<p class="s5">Forty-one reigns</p>
<p class="s4" lang="as">আহোম · স্বৰ্গদেউ · বুৰঞ্জী</p>
</main>
