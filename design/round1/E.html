<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahom</title>
<style>
@font-face{font-family:"Plex Sans";src:url(fonts/IBMPlexSans-Light.woff) format("woff");font-weight:300}
@font-face{font-family:"Plex Sans";src:url(fonts/IBMPlexSans-Regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Plex Serif";src:url(fonts/IBMPlexSerif-Italic.woff) format("woff");font-weight:400;font-style:italic}
@font-face{font-family:"Lohit Assamese";src:url(fonts/Lohit-Assamese.ttf) format("truetype")}
body{margin:0;background:#E3ECEC;color:#1D3A46;min-height:100vh}
main{box-sizing:border-box;min-height:100vh;padding:9vh 10vw;position:relative}
.dates{position:absolute;top:9vh;right:10vw;margin:0;font:300 clamp(1rem,1.6vw,1.3rem)/1 "Plex Sans",sans-serif;color:#B5772A;letter-spacing:.02em}
.title{margin:18vh 0 0;font:300 clamp(2.4rem,6vw,5.6rem)/1.08 "Plex Sans",sans-serif;letter-spacing:-.01em;max-width:14ch}
.flow{margin:9vh 0 0;font:italic 400 clamp(1.1rem,1.7vw,1.5rem)/1.9 "Plex Serif",serif;color:#1D3A46}
.flow span{display:block}
.flow span:nth-child(1){margin-left:0;width:max-content}
.flow span:nth-child(2){margin-left:9ch}
.flow span:nth-child(3){margin-left:3ch}
.flow span:nth-child(4){margin-left:16ch}
.flow span:nth-child(5){margin-left:6ch}
.flow span:nth-child(6){margin-left:20ch}
.flow span:nth-child(7){margin-left:11ch}
.as{font-family:"Lohit Assamese",serif;font-style:normal;color:#1D3A46;margin:0}
.wash{margin:9vh 0 0;font:300 clamp(1.8rem,3.4vw,3rem)/1.4 "Lohit Assamese",serif;color:#B5772A}
</style>
</head>
<body>
<main>
<p class="dates">1228–1838</p>
<h1 class="title">Six hundred years on the Brahmaputra</h1>
<p class="flow">
<span>In 1228 a Tai prince named Sukaphaa</span>
<span>crossed the Patkai hills</span>
<span>into Assam. His line ruled the valley</span>
<span>for six centuries, held off the Mughal Empire</span>
<span>and fell only to Burmese armies</span>
<span>and a British treaty.</span>
<span>Forty-one reigns</span>
</p>
<p class="wash" lang="as">আহোম · স্বৰ্গদেউ · বুৰঞ্জী</p>
</main>
</body>
</html>
