<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahom</title>
<style>
@font-face{font-family:"Gentium Plus";src:url(fonts/GentiumPlus-Regular.woff2) format("woff2");font-weight:400;font-style:normal}
@font-face{font-family:"Gentium Plus";src:url(fonts/GentiumPlus-Italic.woff2) format("woff2");font-weight:400;font-style:italic}
@font-face{font-family:"Lohit Assamese";src:url(fonts/Lohit-Assamese.ttf) format("truetype")}
body{margin:0;background:#1A2A22;color:#F0E6CC;min-height:100vh}
main{box-sizing:border-box;min-height:100vh;padding:12vh 8vw;font:italic 400 clamp(1.4rem,2.6vw,2.3rem)/1.5 "Gentium Plus",serif}
.l{display:block;margin:0 0 .15em;width:max-content}
.l:nth-child(odd){margin-left:0}
.l:nth-child(even){margin-left:min(34vw,28ch)}
.gap{height:3.2em}
.as{font-family:"Lohit Assamese",serif;font-style:normal;font-size:1.25em}
.refrain{font-style:normal;font-variant:small-caps;letter-spacing:.08em;margin-top:.4em}
</style>
</head>
<body>
<main>
<span class="l">Six hundred years</span>
<span class="l">on the Brahmaputra</span>
<span class="l as" lang="as">আহোম</span>
<span class="gap"></span>
<span class="l">In 1228 a Tai prince named Sukaphaa</span>
<span class="l">crossed the Patkai hills into Assam.</span>
<span class="l">His line ruled the valley for six centuries,</span>
<span class="l">held off the Mughal Empire</span>
<span class="l">and fell only to Burmese armies</span>
<span class="l">and a British treaty.</span>
<span class="gap"></span>
<span class="l refrain">1228–1838</span>
<span class="l as" lang="as">স্বৰ্গদেউ</span>
<span class="l refrain">Forty-one reigns</span>
<span class="l as" lang="as">বুৰঞ্জী</span>
</main>
</body>
</html>
