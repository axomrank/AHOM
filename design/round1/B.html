<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ahom</title>
<style>
@font-face{font-family:"Plex Sans Condensed";src:url(fonts/IBMPlexSansCondensed-Regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Plex Sans Condensed";src:url(fonts/IBMPlexSansCondensed-SemiBold.woff) format("woff");font-weight:600}
@font-face{font-family:"Plex Mono";src:url(fonts/IBMPlexMono-Regular.woff) format("woff");font-weight:400}
@font-face{font-family:"Lohit Assamese";src:url(fonts/Lohit-Assamese.ttf) format("truetype")}
body{margin:0;background:#F4F3EE;color:#1E2328;min-height:100vh}
main{box-sizing:border-box;min-height:100vh;padding:7vh 4vw 6vh;display:grid;grid-template-rows:auto 1fr auto;gap:0}
.top{display:flex;justify-content:space-between;align-items:baseline;font:600 .8rem/1 "Plex Mono",monospace;letter-spacing:.3em;text-transform:uppercase;color:#9B3B22}
.span{display:flex;justify-content:space-between;align-items:baseline;font:600 clamp(4rem,14vw,13rem)/.8 "Plex Sans Condensed",sans-serif;letter-spacing:-.03em;color:#1E2328;margin-top:6vh}
.span b{font-weight:600;color:#9B3B22}
.mid{align-self:center;display:grid;grid-template-columns:1fr minmax(0,44ch);gap:4vw;align-items:start;padding-top:8vh}
.as{font:400 1.8rem/1.4 "Lohit Assamese",serif;letter-spacing:0;margin:0}
h1{font:600 1.5rem/1.25 "Plex Sans Condensed",sans-serif;margin:0 0 1rem;letter-spacing:.01em}
p{margin:0;font:400 1.1rem/1.6 "Plex Sans Condensed",sans-serif;color:#1E2328}
.foot{font:400 .8rem/1.6 "Plex Mono",monospace;letter-spacing:.24em;text-transform:uppercase;color:#9B3B22}
</style>
</head>
<body>
<main>
<div class="top"><span lang="as" style="font-family:'Lohit Assamese',serif;letter-spacing:0;font-size:1rem;text-transform:none">আহোম</span><span>Forty-one reigns</span></div>
<div class="span"><span>1228</span><b>1838</b></div>
<div class="mid">
<p class="as" lang="as">স্বৰ্গদেউ</p>
<div>
<h1>Six hundred years on the Brahmaputra</h1>
<p>In 1228 a Tai prince named Sukaphaa crossed the Patkai hills into Assam. His line ruled the valley for six centuries, held off the Mughal Empire and fell only to Burmese armies and a British treaty.</p>
</div>
</div>
<div class="foot"><span lang="as" style="font-family:'Lohit Assamese',serif;letter-spacing:0;font-size:1rem;text-transform:none">বুৰঞ্জী</span></div>
</main>
</body>
</html>
