<h1>Six hundred years on the Brahmaputra</h1>
<p class="dates">1228–1838</p>
<p>In 1228 a Tai prince named Sukaphaa crossed the Patkai hills into Assam. His line ruled the valley for six centuries, held off the Mughal Empire and fell only to Burmese armies and a British treaty.</p>
